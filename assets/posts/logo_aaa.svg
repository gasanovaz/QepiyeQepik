<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="sandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEDCBA"/>
      <stop offset="35%" stop-color="#CEA972"/>
      <stop offset="70%" stop-color="#B38B50"/>
      <stop offset="100%" stop-color="#876330"/>
    </linearGradient>
    <linearGradient id="sandSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="100%" stop-color="#B89158"/>
    </linearGradient>
    <radialGradient id="obsidianBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231E18"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </radialGradient>
  </defs>

  <!-- Outer Rounded Crest Shield -->
  <rect x="4" y="4" width="152" height="152" rx="34" fill="url(#obsidianBg)" stroke="url(#sandGold)" stroke-width="4.5"/>
  <rect x="11" y="11" width="138" height="138" rx="28" fill="none" stroke="url(#sandGold)" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Top Crown Diamond Filigree -->
  <polygon points="80,19 85,25 80,31 75,25" fill="url(#sandGold)"/>
  <line x1="46" y1="25" x2="70" y2="25" stroke="url(#sandGold)" stroke-width="1.4" stroke-opacity="0.7"/>
  <line x1="90" y1="25" x2="114" y2="25" stroke="url(#sandGold)" stroke-width="1.4" stroke-opacity="0.7"/>

  <!-- Heraldic Wings / Shield Silhouette -->
  <path d="M24 52 C42 48, 56 48, 80 43 C104 48, 118 48, 136 52 L126 62 C108 58, 96 57, 80 53 C64 57, 52 58, 34 62 Z" fill="url(#sandGold)" opacity="0.24"/>

  <!-- Sculpted Luxury Grand Tourer Profile Silhouette -->
  <path d="M26 78 C32 72, 46 60, 68 57 C88 55, 108 61, 125 71 C131 74, 135 77, 136 80 L24 80 Z" fill="none" stroke="url(#sandSoft)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 69 C60 61, 86 60, 108 69" fill="none" stroke="url(#sandGold)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="46" cy="81" r="7.5" fill="#0E0C0A" stroke="url(#sandGold)" stroke-width="2.8"/>
  <circle cx="114" cy="81" r="7.5" fill="#0E0C0A" stroke="url(#sandGold)" stroke-width="2.8"/>
  <line x1="56" y1="81" x2="104" y2="81" stroke="url(#sandGold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Monogram Typography -->
  <text x="80" y="111" text-anchor="middle" font-family="'Space Grotesk', 'Cinzel', 'Inter', sans-serif" font-weight="800" font-size="20" fill="url(#sandSoft)" letter-spacing="3.5">AUTO</text>
  <line x1="34" y1="118" x2="126" y2="118" stroke="url(#sandGold)" stroke-width="1" stroke-opacity="0.45"/>
  <text x="80" y="133" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11.5" fill="#D8B986" letter-spacing="1.8">AUKSION.AZ</text>
</svg>
